<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup LagartinShop</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px;background:#f5f6f8}.box{background:white;padding:22px;border-radius:18px}button{padding:13px 16px;border:0;border-radius:12px;background:#111827;color:white;font-weight:800}p{line-height:1.5;color:#555}</style><div class="box"><h1>Backup dos produtos</h1><p>Abra este arquivo no mesmo navegador em que seus 10 produtos estão cadastrados. Ele lê o armazenamento local do LagartinShop e baixa um JSON com produtos e fotos.</p><button onclick="backup()">Baixar backup JSON</button><p id="msg"></p></div><script>function backup(){const keys=['lagartin_products_v2','lagartin_settings_v2'];const data={products:JSON.parse(localStorage.getItem(keys[0])||'[]'),settings:JSON.parse(localStorage.getItem(keys[1])||'{}'),exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='lagartinshop-backup.json';a.click();document.getElementById('msg').textContent=`Backup criado com ${data.products.length} produto(s).`;}</script></html>
