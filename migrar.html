<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrar • LagartinShop</title><style>body{font-family:system-ui;max-width:700px;margin:25px auto;padding:18px;background:#f5f6f8;color:#17191d}.box{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin-bottom:15px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}button{padding:12px 16px;border:0;border-radius:12px;background:#111827;color:white;font-weight:800;margin-top:10px}.ok{color:#166534}.err{color:#b91c1c}.small{color:#666;font-size:13px;line-height:1.5}</style></head><body><div class="box"><h1>Migrar produtos</h1><p class="small">Use depois de configurar o Firebase. Se você fizer o backup dos 10 produtos antigos, este arquivo envia produtos e fotos para o novo banco online.</p><input id="file" type="file" accept="application/json"><br><button onclick="login()">Entrar e migrar</button><p id="msg"></p></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script>
let db,storage;try{firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore();storage=firebase.storage()}catch(e){msg('Configure firebase-config.js primeiro.','err')}
function msg(t,c){const e=document.getElementById('msg');e.textContent=t;e.className=c||''}
async function upload(data,docId,i){if(!data.startsWith('data:'))return data;const blob=await (await fetch(data)).blob(),ref=storage.ref(`products/${docId}/migrated_${i}.jpg`);await ref.put(blob,{contentType:'image/jpeg'});return ref.getDownloadURL()}
async function login(){const email=prompt('E-mail do administrador do Firebase:');const pass=prompt('Senha do administrador:');if(!email||!pass)return;try{await firebase.auth().signInWithEmailAndPassword(email,pass);const f=document.getElementById('file').files[0];if(!f){msg('Selecione o backup JSON primeiro.','err');return}const data=JSON.parse(await f.text());msg(`Migrando ${data.products.length} produto(s)...`);for(const p of data.products){const ref=db.collection('products').doc();const images=await Promise.all((p.images||[]).map((x,i)=>upload(x,ref.id,i)));await ref.set({name:p.name,category:p.category||p.cat||'Roupas',price:Number(p.price||0),stock:Number(p.stock||0),condition:p.condition||'Novo',brand:p.brand||'',description:p.description||p.desc||'',images,emoji:p.emoji||'📦',createdAt:firebase.firestore.FieldValue.serverTimestamp()})}msg(`Concluído: ${data.products.length} produto(s) migrado(s).`,'ok')}catch(e){console.error(e);msg('Erro na migração: '+e.message,'err')}}
</script></body></html>
